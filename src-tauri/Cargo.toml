[package]
name = "p2pkanban-arch-native"
version = "0.1.0"
description = "Native Arch-based Linux client for p2pKanban"
authors = ["p2pKanban contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
